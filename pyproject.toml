[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automl-agents"
version = "0.1.0"
description = "Arquitectura multiagente + RAG para automatizar la selección, entrenamiento y empaquetado de modelos de clasificación de imágenes (tesis PUCP)"
requires-python = ">=3.10"
dependencies = [
  "tensorflow-cpu>=2.16; sys_platform != 'win32' and platform_machine != 'x86_64_gpu'",
  "optuna>=3.6",
  "chromadb>=0.5",
  "langgraph>=0.2",
  "scikit-learn>=1.4",
  "psutil>=5.9",
  "pillow>=10",
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "anthropic>=0.40",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
automl-agents = "automl_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
automl_agents = ["knowledge/*.md", "knowledge/*.json", "web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
