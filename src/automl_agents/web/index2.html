<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Construya su clasificador de imágenes</title>
<style>
  :root {
    --bg: #f3f5f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --signal: #f59e0b;
    --signal-hover: #d97706;
    --signal-ink: #ffffff;
    --steel: #2563eb;
    --steel-hover: #1d4ed8;
    --ok: #10b981;
    --bad: #ef4444;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    --radius: 12px;
    --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --paper: #1e293b;
      --ink: #f8fafc;
      --muted: #94a3b8;
      --line: #334155;
      --steel: #3b82f6;
      --steel-hover: #60a5fa;
      --ok: #34d399;
      --bad: #f87171;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 var(--font);
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 800px;
    margin: 0 auto;
    padding: 48px 24px 96px;
  }

  .header {
    text-align: center;
    margin-bottom: 40px;
  }

  h1 {
    font-size: clamp(2rem, 5vw, 2.75rem);
    line-height: 1.2;
    margin: 0 0 16px;
    letter-spacing: -0.03em;
    font-weight: 800;
  }

  .lead {
    max-width: 62ch;
    margin: 0 auto;
    color: var(--muted);
    font-size: 1.1rem;
  }

  form, .panel {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px;
    margin-bottom: 32px;
    box-shadow: var(--shadow-md);
    transition: all 0.3s ease;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  @media (min-width: 640px) {
    .form-grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
  }

  .field-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 20px;
  }

  label {
    display: flex;
    flex-direction: column;
    font-weight: 600;
    font-size: 0.95rem;
    margin-bottom: 8px;
  }

  .hint {
    color: var(--muted);
    font-weight: 400;
    font-size: 0.85rem;
    margin-top: 4px;
  }

  input[type=file], textarea, select {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    font-size: 0.95rem;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input[type=file] {
    padding: 10px;
    cursor: pointer;
  }

  textarea {
    min-height: 90px;
    resize: vertical;
  }

  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--steel);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
  }

  button {
    width: 100%;
    margin-top: 12px;
    padding: 14px 28px;
    border: 0;
    border-radius: 8px;
    background: var(--steel);
    color: #ffffff;
    font: inherit;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: background-color 0.2s, transform 0.1s;
  }

  button:hover {
    background: var(--steel-hover);
  }

  button:active {
    transform: translateY(1px);
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .err {
    color: var(--bad);
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid var(--bad);
    border-radius: 8px;
    padding: 12px 16px;
    margin-top: 20px;
    font-weight: 600;
    font-size: 0.9rem;
  }

  /* Pasos de progreso estilizados */
  ol.steps {
    list-style: none;
    padding: 0;
    margin: 0 0 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  ol.steps li {
    display: flex;
    align-items: center;
    gap: 14px;
    color: var(--muted);
    font-size: 0.95rem;
    padding: 8px 12px;
    border-radius: 6px;
    transition: background 0.2s;
  }

  ol.steps li::before {
    content: "";
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--line);
    flex: none;
    transition: all 0.3s ease;
  }

  ol.steps li.now {
    color: var(--ink);
    font-weight: 700;
    background: rgba(245, 158, 11, 0.08);
  }

  ol.steps li.now::before {
    border-color: var(--signal);
    background: var(--signal);
    box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.2);
    animation: pulse 1.5s infinite;
  }

  ol.steps li.done {
    color: var(--ink);
  }

  ol.steps li.done::before {
    border-color: var(--ok);
    background: var(--ok);
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
    70% { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
    100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
  }

  #log {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 0.85rem;
    color: var(--muted);
    background: var(--bg);
    max-height: 180px;
    overflow-y: auto;
    border-radius: 8px;
    padding: 16px;
    margin: 0;
    list-style: none;
    border: 1px solid var(--line);
  }

  #log li {
    margin-bottom: 6px;
    line-height: 1.4;
  }

  #log li:last-child { margin-bottom: 0; }

  /* Panel de Resultados */
  #result {
    text-align: center;
    border-top: 4px solid var(--ok);
  }

  .kpi {
    font-size: clamp(2.5rem, 8vw, 4rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--ok);
    margin-bottom: 8px;
  }

  .row {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 28px;
  }

  a.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 24px;
    border-radius: 8px;
    border: 1px solid var(--line);
    color: var(--ink);
    font-weight: 600;
    text-decoration: none;
    background: var(--bg);
    transition: all 0.2s;
  }

  a.btn:hover {
    border-color: var(--muted);
  }

  a.btn.main {
    background: var(--steel);
    color: #ffffff;
    border: none;
    box-shadow: var(--shadow-sm);
  }

  a.btn.main:hover {
    background: var(--steel-hover);
  }

  pre {
    text-align: left;
    white-space: pre-wrap;
    background: var(--bg);
    padding: 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    font-size: 0.9rem;
    margin-top: 20px;
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="header">
    <h1>Construya su clasificador de imágenes</h1>
    <p class="lead">Suba sus fotos ya ordenadas por categoría. El sistema prueba varios modelos, elige el mejor y le entrega una API lista para usar.</p>
  </div>

  <form id="form">
    <div class="field-group">
      <label for="file">Su dataset en formato ZIP
        <span class="hint">Una carpeta por categoría, con las fotos dentro. Ejemplo: <code>defectuoso/</code>, <code>correcto/</code>.</span>
      </label>
      <input id="file" name="file" type="file" accept=".zip" required>
    </div>

    <div class="field-group">
      <label for="use_case">¿Para qué usará el clasificador?
        <span class="hint">Una frase basta. Si sus fotos incluyen personas, menciónelo: le avisaremos qué cuidar.</span>
      </label>
      <textarea id="use_case" name="use_case" maxlength="1000" placeholder="Ejemplo: Separar piezas defectuosas en la línea de empaque"></textarea>
    </div>

    <div class="form-grid-2col">
      <div class="field-group">
        <label for="budget">Tiempo de procesamiento</label>
        <select id="budget" name="budget">
          <option value="rapido">Rápido: menos pruebas</option>
          <option value="estandar" selected>Equilibrado</option>
          <option value="exhaustivo">Exhaustivo: más pruebas</option>
        </select>
      </div>

      <div class="field-group">
        <label for="tier">Capacidad de cómputo</label>
        <select id="tier" name="tier">
          <option value="low" selected>Equipo modesto / GPU 4 GB</option>
          <option value="medium">GPU 8 GB o superior</option>
          <option value="high">GPU potente / Nube</option>
        </select>
      </div>
    </div>

    <button id="go" type="submit">Crear mi clasificador</button>
    <div id="err" class="err" role="alert" hidden></div>
  </form>

  <section id="progress" class="panel" hidden aria-live="polite">
    <ol class="steps" id="steps"></ol>
    <ul id="log"></ul>
  </section>

  <section id="result" class="panel" hidden>
    <div class="kpi" id="acc"></div>
    <p id="acc-note" style="color:var(--muted); margin:0; font-size:1.05rem;"></p>
    <div class="row">
      <a class="btn main" id="dl" href="#">Descargar modelo y reportes</a>
      <a class="btn" id="rep" href="#" target="_blank" rel="noopener">Ver reporte completo</a>
    </div>
    <pre id="report" hidden></pre>
  </section>
</main>

<script>
const STAGES = [
  ["perfil","Revisando sus imágenes"], ["rag","Consultando buenas prácticas"],
  ["candidatas","Eligiendo los modelos a probar"], ["train","Entrenando y comparando"],
  ["evaluacion","Evaluando con imágenes nuevas"], ["reportes","Escribiendo los reportes"], ["listo","Modelo listo"]
];
const $ = id => document.getElementById(id);
let timer = null;

function renderSteps(events) {
  const seen = new Set(events.map(e => e.stage === "control" ? "train" : e.stage));
  let last = -1; STAGES.forEach(([k], i) => { if (seen.has(k)) last = i; });
  $("steps").innerHTML = STAGES.map(([k, t], i) =>
    `<li class="${i < last || (i === last && k === "listo") ? "done" : i === last ? "now" : ""}">${t}</li>`).join("");
  $("log").innerHTML = events.slice(-8).reverse().map(e => `<li>${e.message.replace(/</g, "&lt;")}</li>`).join("");
}

async function poll(id) {
  const r = await fetch(`/api/runs/${id}`); const d = await r.json();
  renderSteps(d.events || []);
  if (d.status === "done") {
    clearInterval(timer);
    const s = d.summary, acc = (s.test.accuracy * 100).toFixed(0);
    $("acc").textContent = `${acc} % de aciertos`;
    $("acc-note").textContent = `Modelo elegido: ${s.winner.architecture}. Medido con ${s.test.n_test} imágenes que no vio al entrenar.`;
    $("dl").href = `/api/runs/${id}/download`; $("rep").href = `/api/runs/${id}/report`;
    $("result").hidden = false; $("go").disabled = false;
  } else if (d.status === "error") {
    clearInterval(timer); $("go").disabled = false;
    $("err").textContent = d.message || "La ejecución falló."; $("err").hidden = false;
  }
}

$("form").addEventListener("submit", async ev => {
  ev.preventDefault();
  $("err").hidden = true; $("result").hidden = true; $("go").disabled = true;
  const res = await fetch("/api/runs", { method: "POST", body: new FormData($("form")) });
  const d = await res.json();
  if (!res.ok) { $("err").textContent = d.detail || "No se pudo cargar el dataset."; $("err").hidden = false; $("go").disabled = false; return; }
  $("progress").hidden = false; renderSteps([]);
  timer = setInterval(() => poll(d.run_id), 3000); poll(d.run_id);
});
</script>
</body>
</html>
